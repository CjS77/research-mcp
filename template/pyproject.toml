[project]
name = "research-kb"
version = "0.1.0"
description = "Fidelity-first vectorized retrieval + distillation knowledge base, served over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "click>=8.1.7",
    "mcp>=1.2",
    "pyyaml>=6.0",
    # In-process neural embeddings via ONNX runtime (no torch, no server). Core, not an extra:
    # the shipped DB records embed_backend=fastembed, so serving queries requires it.
    "fastembed>=0.4",
]

[project.optional-dependencies]
# LLM extraction/enrichment (Opus native-PDF). Activates when ANTHROPIC_API_KEY is set.
llm = ["anthropic>=0.40"]
# Deterministic extraction via marker-pdf (heavy: torch + surya). Optional; pymupdf is the default.
marker = ["marker-pdf>=0.9"]
# Local embedding backend (heavy: torch). TEI/HTTP is the default production backend.
local-embed = ["sentence-transformers>=3.0"]

[project.scripts]
research-kb = "research_kb.cli:main"
research-kb-mcp = "research_kb.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_kb"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line-length enforced by formatter, not lint
    "SIM905",  # `"word word ...".split()` is the intentional readable form for long word-set literals
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# numpy ships 3.12-only syntax in its stubs (PEP 695 `type` statements); at our 3.11 target mypy
# would reject them and bail before checking our own code. We don't type-check against numpy anyway.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
